name: Desktop installers

# Manual macOS runs make test builds with an ad-hoc signature. Gatekeeper
# requires Open Anyway for a downloaded copy. Version tags still publish only
# Windows and Linux until macOS has Developer ID signing and notarization.
# Do not pass absent Apple certificate secrets as empty environment variables:
# Tauri treats a defined APPLE_CERTIFICATE as a request to import a certificate.

on:
  # Run this by hand from the Actions tab to get a test build of any branch.
  # A manual run creates no tag and no release: it attaches the installers to
  # the run itself, under Artifacts, and picking one platform keeps it quick.
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        default: windows
        options:
          - windows
          - linux
          - macos
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  choose-platforms:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the build matrix
        id: pick
        shell: bash
        env:
          # A tag builds only release platforms. Manual runs can include macOS
          # test artifacts and default to Windows.
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'release' }}
        run: |
          windows='{"name":"Windows x64","platform":"windows-latest","rustTargets":"","args":"--bundles nsis,msi"}'
          linux='{"name":"Linux x64","platform":"ubuntu-22.04","rustTargets":"","args":"--bundles appimage,deb"}'
          mac_arm='{"name":"macOS Apple Silicon test","platform":"macos-15","rustTargets":"aarch64-apple-darwin","args":"--bundles app,dmg --target aarch64-apple-darwin"}'
          mac_intel='{"name":"macOS Intel test","platform":"macos-15-intel","rustTargets":"x86_64-apple-darwin","args":"--bundles app,dmg --target x86_64-apple-darwin"}'
          case "$REQUESTED" in
            windows) include="$windows" ;;
            linux)   include="$linux" ;;
            macos)   include="$mac_arm,$mac_intel" ;;
            all)     include="$windows,$linux,$mac_arm,$mac_intel" ;;
            release) include="$windows,$linux" ;;
          esac
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: ${{ matrix.name }}
    needs: choose-platforms
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.choose-platforms.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: SplyntDesktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: SplyntDesktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: SplyntDesktop
        run: npm ci

      - name: Run desktop tests
        working-directory: SplyntDesktop
        run: npm run test

      - name: Build desktop frontend
        working-directory: SplyntDesktop
        run: npm run build

      - name: Audit production frontend dependencies
        working-directory: SplyntDesktop
        run: npm audit --omit=dev --audit-level=high

      - name: Check Rust formatting
        working-directory: SplyntDesktop/src-tauri
        run: cargo fmt --check

      - name: Lint native host
        working-directory: SplyntDesktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run native host tests
        working-directory: SplyntDesktop/src-tauri
        run: cargo test

      - name: Sign macOS test build ad hoc
        if: startsWith(matrix.platform, 'macos-')
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: SplyntDesktop
          # Only a tag push publishes anything. A manual run leaves these empty,
          # so no draft release is created and the installers are downloadable
          # from the run's Artifacts section instead.
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: ${{ github.ref_type == 'tag' && 'Splynt v__VERSION__' || '' }}
          releaseDraft: ${{ github.ref_type == 'tag' }}
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Splynt-[version]-[platform]-[arch]-[bundle]
          args: ${{ matrix.args }}
