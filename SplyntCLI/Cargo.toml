[package]
name = "splynt"
version = "0.1.0"
edition = "2024"
description = "Splynt in the terminal: a Subsonic and Navidrome music client"
license = "GPL-3.0-or-later"
repository = "https://github.com/elijahgronda/Splynt"

[[bin]]
name = "splynt"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.17"
crossterm = "0.29"
dirs = "7.0.0"
image = "0.25.10"
md5 = "0.8.1"
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
rodio = { version = "0.23.0", default-features = false, features = ["symphonia-all", "playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
unicode-width = "0.2.3"
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 4
