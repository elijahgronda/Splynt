[package]
name = "splynt-desktop"
version = "1.2.0"
description = "Splynt music client for macOS, Windows, and Linux"
authors = ["Splynt"]
edition = "2021"

[lib]
name = "splynt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
futures-util = "0.3"
md5 = "0.7"
keyring = "4"
hostname = "0.4"
local-ip-address = "0.6"
mdns-sd = "0.21"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
